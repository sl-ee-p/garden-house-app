name: garden_house_app
description: "Configuratore 3D in italiano delle casette da giardino Techs Garden House, con anteprima in realtà aumentata."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Patched copy, see third_party/ar_flutter_plugin_2/PATCHES.md
  ar_flutter_plugin_2:
    path: third_party/ar_flutter_plugin_2
  model_viewer_plus: ^1.10.0
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  vector_math: ^2.4.3
  webview_flutter: ^4.14.1
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/models/garden_house.glb
    - assets/env/garden.jpg
    - assets/env/garden.hdr
    - assets/textures/
    - assets/finiture/

